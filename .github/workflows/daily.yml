name: Daily job update
on:
  schedule:
    - cron: "30 1 * * *"   # 7:00 AM IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python fetch_jobs.py
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      - name: Commit updated jobs
        run: |
          git config user.name "job-bot"; git config user.email "bot@users.noreply.github.com"
          git add jobs.json
          git commit -m "Daily job update $(date -u +%F)" || echo "no changes"
          git push
